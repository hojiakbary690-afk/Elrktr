const G=[{"c": "Montaj va ulash", "e": "⚡", "t": "Elektromontaj 2D", "d": "Shit yig'ish, joylash, sim ulash va sinov (5 bosqich)", "u": "https://claude.ai/artifact/8uMtaJ3CDRmtXSm1PUpUJg", "h": "<!DOCTYPE html>\n<html lang=\"uz\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Elektromontaj 2D<\/title>\n<style>\n:root{--card:#fff;--ink:#14202b;--mut:#5b6773;--line:#c9d0d7;--y:#f5c400;--ok:#15803d;--bad:#c62828}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--card:#1b252f;--ink:#eef2f5;--mut:#9aa7b3;--line:#33414e;--ok:#4ade80;--bad:#f87171}}\n:root[data-theme=\"dark\"]{--card:#1b252f;--ink:#eef2f5;--mut:#9aa7b3;--line:#33414e;--ok:#4ade80;--bad:#f87171}\n[hidden]{display:none!important}\nhtml,body{margin:0;height:100%;background:#14202b;font:500 15px/1.4 system-ui,sans-serif;color:var(--ink)}\nbody{display:flex;flex-direction:column}\n#hud{padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;display:flex;justify-content:space-between;gap:8px;background:#14202b;color:#fff;border-bottom:3px solid var(--y)}\n#hud b{font-size:17px}#hud small{display:block;color:#cbd5dd}\n.sc{background:var(--y);color:#14202b;font-weight:700;font-size:20px;padding:2px 12px;border-radius:4px;height:fit-content}\n#sv{flex:1;min-height:0;width:100%;display:block;touch-action:manipulation}\n#sv text{font:600 10px system-ui,sans-serif;pointer-events:none}\n#bt{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--line)}\n#tx{font-weight:600}#msg{margin-top:4px;min-height:20px;color:var(--mut)}#msg.ok{color:var(--ok)}#msg.bad{color:var(--bad)}\n#tools{display:flex;gap:6px;margin-top:8px}#tools button{flex:1;padding:10px 4px;border:2px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;font-weight:600}\n#tools button.on{border-color:var(--y);box-shadow:0 0 0 2px var(--y)}\n#end{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px}\n#end div{background:var(--card);border-radius:10px;padding:24px;text-align:center;max-width:340px}\n#end h2{margin:0}#end p{font-size:44px;margin:6px 0;color:#d4a000}\nbutton.go{background:var(--y);color:#14202b;border:0;border-radius:6px;padding:12px 20px;font:700 17px system-ui}\nbutton:focus-visible{outline:3px solid var(--y)}\n@media(prefers-reduced-motion:no-preference){.shake{animation:sk .25s}@keyframes sk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}}\n<\/style><\/head><body>\n<div id=\"hud\"><div><b>Elektromontaj 2D<\/b><small id=\"tk\"><\/small><\/div><div class=\"sc\" id=\"sc\">100<\/div><\/div>\n<svg id=\"sv\" viewBox=\"0 0 360 620\" preserveAspectRatio=\"xMidYMid meet\"><\/svg>\n<div id=\"bt\"><div id=\"tx\"><\/div><div id=\"msg\"><\/div>\n<div id=\"tools\" hidden><button data-t=\"L\" class=\"on\">🟥 Faza<\/button><button data-t=\"N\">🟦 Nol<\/button><button data-t=\"PE\">🟨 Yer<\/button><\/div><\/div>\n<div id=\"end\" hidden><div><h2>Ish qabul qilindi!<\/h2><p id=\"stars\"><\/p><span id=\"res\"><\/span><br><br><button class=\"go\" onclick=\"location.reload()\">Qayta o'ynash<\/button><\/div><\/div>\n<script>\nconst $=s=>document.querySelector(s);\nlet step=0,score=100,sel=null,pw=true,tool='L',swOn=false,fin=false,lamp=0,sw=0,cnt=0,wires=[];\nconst dm=[0,0,0,0];\nconst MN=[\"Kirish 32A\",\"UZO 30mA\",\"Yoritish 10A\",\"Rozetka 16A\"],SN=[\"1 Kirish\",\"2 UZO\",\"3 Yoritish\",\"4 Rozetka\"],MC=[\"#1f2937\",\"#f8fafc\",\"#9ca3af\",\"#6b7280\"],MT=[\"#fff\",\"#14202b\",\"#14202b\",\"#fff\"];\nconst TP={P_L:[145,296,\"Avtomat L\"],P_N:[204,315,\"N shina\"],SI:[285,334,\"kirish\"],SO:[315,334,\"chiqish\"],LL:[160,34,\"Lampa L\"],LN:[200,34,\"Lampa N\"]};\nconst R={\"P_L|SI\":'L',\"LL|SO\":'L',\"LN|P_N\":'N'},COL={L:'#dc2626',N:'#2563eb'};\nconst TITLE=[\"Xavfsizlik\",\"Shit yig'ish\",\"Joylash\",\"Sim ulash\",\"Sinov\"];\nconst TXT=[\"Kuchlanishni o'chiring: yuqori chapdagi rubilnik tutqichini bosing.\",\"Pastdagi qurilmani bosing, so'ng shitdagi mos sariq joyni bosing.\",\"Lampani shiftga, o'chirgichni devorga o'rnating (tanlang, so'ng sariq joyni bosing).\",\"Sim rangini tanlang, so'ng ikkita nuqtani bosing: faza, faza, nol.\",\"Rubilnikni yoqing, so'ng o'chirgichni bosing.\"];\nfunction hud(){$('#tk').textContent=(step+1)+\"/5 · \"+TITLE[step];$('#tx').textContent=TXT[step];$('#sc').textContent=score;$('#tools').hidden=step!==3}\nfunction msg(t,ok){const m=$('#msg');m.textContent=t;m.className=ok?'ok':'bad';if(!ok){$('#sv').classList.remove('shake');void $('#sv').offsetWidth;$('#sv').classList.add('shake')}}\nfunction pen(n,t){score=Math.max(0,score-n);hud();msg(t+\" (−\"+n+\")\",0)}\nfunction next(){step++;sel=null;cnt=0;hud();draw()}\nconst st=id=>sel===id?'stroke=\"#f5c400\" stroke-width=\"4\"':'stroke=\"#14202b\" stroke-width=\"2\"';\nconst lit=()=>pw&&swOn&&step===4;\nfunction draw(){\n let s=`<rect width=\"360\" height=\"620\" fill=\"#d9dee3\"/><rect width=\"360\" height=\"22\" fill=\"#eef1f4\"/><rect y=\"424\" width=\"360\" height=\"196\" fill=\"#8b6b4a\"/><rect y=\"418\" width=\"360\" height=\"10\" fill=\"#6b4f35\"/>`;\n /* rubilnik */\n s+=`<g data-id=\"lever\"><rect x=\"24\" y=\"95\" width=\"46\" height=\"62\" rx=\"6\" fill=\"#374151\"/><rect x=\"40\" y=\"${pw?104:128}\" width=\"14\" height=\"22\" rx=\"3\" fill=\"${pw?'#16a34a':'#dc2626'}\"/><\/g><text x=\"47\" y=\"88\" text-anchor=\"middle\" fill=\"#14202b\">Rubilnik ${pw?'yoniq':\"o'chiq\"}<\/text>`;\n /* shit */\n s+=`<rect x=\"20\" y=\"170\" width=\"200\" height=\"160\" rx=\"6\" fill=\"#8a9199\"/><rect x=\"26\" y=\"230\" width=\"188\" height=\"4\" fill=\"#cfd4d8\"/><rect x=\"34\" y=\"312\" width=\"176\" height=\"6\" fill=\"#3b82f6\"/><text x=\"120\" y=\"184\" text-anchor=\"middle\" fill=\"#fff\">Elektr shit<\/text>`;\n for(let i=0;i<4;i++){const x=34+i*46;\n  if(dm[i])s+=`<rect x=\"${x}\" y=\"190\" width=\"38\" height=\"86\" rx=\"3\" fill=\"${MC[i]}\" stroke=\"#14202b\" stroke-width=\"2\"/><text x=\"${x+19}\" y=\"236\" text-anchor=\"middle\" fill=\"${MT[i]}\">${SN[i].split(' ')[1]}<\/text>`;\n  else if(step===1)s+=`<rect data-id=\"s${i}\" x=\"${x}\" y=\"190\" width=\"38\" height=\"86\" rx=\"3\" fill=\"rgba(245,196,0,.35)\" stroke=\"#f5c400\" stroke-width=\"2\" stroke-dasharray=\"5 3\"/><text x=\"${x+19}\" y=\"236\" text-anchor=\"middle\" fill=\"#14202b\">${SN[i].split(' ')[0]}<\/text><text x=\"${x+19}\" y=\"248\" text-anchor=\"middle\" fill=\"#14202b\">${SN[i].split(' ')[1]}<\/text>`}\n /* lampa */\n const lx=lamp?180:90,ly=lamp?70:590;\n if(lit())s+=`<circle cx=\"180\" cy=\"70\" r=\"90\" fill=\"#fde047\" opacity=\".35\"/><circle cx=\"180\" cy=\"70\" r=\"55\" fill=\"#fde047\" opacity=\".4\"/>`;\n if(step===2&&!lamp)s+=`<circle data-id=\"ceil\" cx=\"180\" cy=\"70\" r=\"28\" fill=\"rgba(245,196,0,.35)\" stroke=\"#f5c400\" stroke-width=\"2\" stroke-dasharray=\"5 3\"/><text x=\"180\" y=\"108\" text-anchor=\"middle\">Shift<\/text>`;\n s+=`<g ${lamp?'':'data-id=\"lamp\"'}><rect x=\"${lx-8}\" y=\"${ly-26}\" width=\"16\" height=\"12\" fill=\"#6b7280\"/><circle cx=\"${lx}\" cy=\"${ly}\" r=\"15\" fill=\"${lit()?'#fde047':'#e5e7eb'}\" ${lamp?'stroke=\"#14202b\" stroke-width=\"2\"':st('lamp')}/><\/g>`;\n if(!lamp)s+=`<text x=\"${lx}\" y=\"${ly+30}\" text-anchor=\"middle\" fill=\"#fff\">Lampa<\/text>`;\n /* o'chirgich */\n if(step===2&&!sw)s+=`<rect data-id=\"wall\" x=\"268\" y=\"312\" width=\"64\" height=\"44\" rx=\"4\" fill=\"rgba(245,196,0,.35)\" stroke=\"#f5c400\" stroke-width=\"2\" stroke-dasharray=\"5 3\"/><text x=\"300\" y=\"370\" text-anchor=\"middle\">pol dan 90 sm<\/text>`;\n const wx=sw?300:250,wy=sw?334:590;\n s+=`<g ${sw&&step===4?'data-id=\"sw\"':(sw?'':'data-id=\"sw\"')}><rect x=\"${wx-24}\" y=\"${wy-18}\" width=\"48\" height=\"36\" rx=\"4\" fill=\"${swOn?'#fde68a':'#f1f5f9'}\" ${sw?'stroke=\"#14202b\" stroke-width=\"2\"':st('sw')}/><rect x=\"${wx-6}\" y=\"${wy-10}\" width=\"12\" height=\"20\" rx=\"2\" fill=\"#94a3b8\"/><\/g>`;\n if(!sw)s+=`<text x=\"${wx}\" y=\"${wy+32}\" text-anchor=\"middle\" fill=\"#fff\">O'chirgich<\/text>`;\n /* stol qurilmalari */\n for(let i=0;i<4;i++)if(!dm[i]){const x=30+i*80;s+=`<rect data-id=\"m${i}\" x=\"${x}\" y=\"450\" width=\"40\" height=\"88\" rx=\"4\" fill=\"${MC[i]}\" ${st('m'+i)}/><text x=\"${x+20}\" y=\"554\" text-anchor=\"middle\" fill=\"#fff\">${MN[i]}<\/text>`}\n /* simlar */\n wires.forEach(w=>{const[a,b]=w.k.split('|'),p=TP[a],q=TP[b],cx=(p[0]+q[0])/2+34,cy=(p[1]+q[1])/2;\n  const d=`M${p[0]} ${p[1]} Q${cx} ${cy} ${q[0]} ${q[1]}`;\n  s+=w.t==='PE'?`<path d=\"${d}\" stroke=\"#eab308\" stroke-width=\"5\" fill=\"none\"/><path d=\"${d}\" stroke=\"#16a34a\" stroke-width=\"5\" stroke-dasharray=\"8 8\" fill=\"none\"/>`:`<path d=\"${d}\" stroke=\"${COL[w.t]}\" stroke-width=\"5\" fill=\"none\"/>`});\n if(step>=3)for(const k in TP){const t=TP[k];s+=`<circle data-id=\"${k}\" cx=\"${t[0]}\" cy=\"${t[1]}\" r=\"11\" fill=\"${sel===k?'#f5c400':'#fff'}\" stroke=\"#14202b\" stroke-width=\"3\"/><text x=\"${t[0]}\" y=\"${t[1]+26}\" text-anchor=\"middle\">${t[2]}<\/text>`}\n $('#sv').innerHTML=s;\n}\nfunction pick(id){\n if(step===0){if(id==='lever'){pw=false;msg(\"Kuchlanish o'chirildi ✓\",1);next()}else pen(20,\"⚡ Tok urdi! Avval rubilnikni o'chiring\");return}\n if(step===1){\n  if(/^m\\d$/.test(id)){sel=id;msg(\"Tanlandi. Shitdagi joyni bosing.\",1)}\n  else if(/^s\\d$/.test(id)){if(!sel)return msg(\"Avval pastdan qurilmani tanlang.\",0);\n   if(sel[1]===id[1]){dm[+id[1]]=1;sel=null;msg(\"To'g'ri o'rnatildi ✓\",1);if(++cnt===4)return next()}\n   else pen(5,\"Noto'g'ri joy. Tok yo'nalishi: kirish → UZO → guruhlar\")}\n  return draw()}\n if(step===2){\n  if(id==='lamp'||id==='sw'){sel=id;msg(\"Tanlandi. Sariq joyni bosing.\",1)}\n  else if(id==='ceil'||id==='wall'){if(!sel)return msg(\"Avval pastdan qurilmani tanlang.\",0);\n   if(sel==='lamp'&&id==='ceil'){lamp=1;sel=null;msg(\"Lampa o'rnatildi ✓\",1);if(++cnt===2)return next()}\n   e ;align-items:center;text-align:left;padding:12px;margin-bottom:8px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-weight:600}\n.ap span{background:var(--y);color:#14202b;border-radius:6px;padding:2px 10px;font-weight:700}\n.v{margin-top:6px;font-weight:700}\n#end{position:fixed;inset:0;background:#14202bee;display:flex;align-items:center;justify-content:center;padding:18px}\n#end>div{background:var(--card);border-radius:10px;padding:22px;text-align:center;max-width:340px}\n#stars{font-size:44px;color:#d4a000;margin:6px 0}\nbutton:focus-visible{outline:3px solid var(--y)}\n@media(prefers-reduced-motion:no-preference){.spin{animation:sp .7s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{to{transform:rotate(360deg)}}.shake{animation:sk .25s}@keyframes sk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}}\n<\/style><\/head><body>\n<div id=\"hud\"><div><b>Elektr sinov<\/b><small id=\"tk\"><\/small><\/div><div class=\"sc\" id=\"sc\">100<\/div><\/div>\n<div id=\"view\"><\/div>\n<div id=\"bt\"><div id=\"tx\"><\/div><div id=\"msg\"><\/div><div id=\"act\"><\/div><\/div>\n<div id=\"end\" hidden><div><h2 style=\"margin:0\">Sinovlar tugadi!<\/h2><div id=\"stars\"><\/div><p id=\"res\"><\/p><button style=\"background:#f5c400;border:0;border-radius:8px;padding:12px 20px;font:700 17px system-ui\" onclick=\"location.reload()\">Qayta o'ynash<\/button><\/div><\/div>\n<script>\nconst $=s=>document.querySelector(s);\nconst NM=[\"Ampermetr va voltmetr\",\"Uch fazali motor\",\"Anjomlar yuklamasi\",\"Nosozlikni topish\"];\nlet lv=0,score=100,burns=0,works=0;\nfunction hud(){$('#tk').textContent=(lv+1)+\"/4 · \"+NM[lv];$('#sc').textContent=score}\nfunction msg(t,ok){const e=$('#msg');e.textContent=t;e.className=ok?'ok':'bad';if(!ok){const s=$('#view');s.classList.remove('shake');void s.getBoundingClientRect();s.classList.add('shake')}}\nfunction pen(n){score=Math.max(0,score-n);hud()}\nfunction act(h){$('#act').innerHTML=h}\nfunction nextBtn(){act(`<button class=\"go\" id=\"nx\">${lv<3?\"Keyingi bosqich →\":\"Natijani ko'rish\"}<\/button>`);$('#nx').onclick=()=>{lv++;lv<4?start():end()}}\nfunction start(){hud();[lA,lB,lC,lD][lv]()}\nfunction end(){const n=score>=80?3:score>=55?2:1;$('#stars').textContent='★'.repeat(n)+'☆'.repeat(3-n);$('#res').textContent=\"Ball: \"+score+\" / 100 · Ishladi: \"+works+\" · Kuydi: \"+burns;$('#end').hidden=false}\nfunction UF(ids,E){const p={};ids.forEach(i=>p[i]=i);const f=x=>p[x]===x?x:(p[x]=f(p[x]));E.forEach(e=>{p[f(e[0])]=f(e[1])});return f}\n/* tap-tap sim ulash dvigateli */\nfunction wl(c){\n let W=[],sel=null,res=null;\n $('#view').innerHTML=`<svg id=\"sv\" viewBox=\"0 0 360 400\"><\/svg>${c.ex?'<div id=\"ex\"><\/div>':''}`;\n $('#tx').textContent=c.tx;\n function draw(){let s=c.bg(res);\n  W.forEach((w,i)=>{const a=c.pos[w[0]],b=c.pos[w[1]];s+=`<line x1=\"${a[0]}\" y1=\"${a[1]}\" x2=\"${b[0]}\" y2=\"${b[1]}\" stroke=\"#f59e0b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line data-w=\"${i}\" x1=\"${a[0]}\" y1=\"${a[1]}\" x2=\"${b[0]}\" y2=\"${b[1]}\" stroke=\"transparent\" stroke-width=\"22\"/>`});\n  for(const id in c.pos){const p=c.pos[id];s+=`<circle data-t=\"${id}\" cx=\"${p[0]}\" cy=\"${p[1]}\" r=\"11\" fill=\"${sel===id?'#f5c400':'#fff'}\" stroke=\"#14202b\" stroke-width=\"3\"/>`+(p[2]?`<text x=\"${p[0]+(p[3]||0)}\" y=\"${p[1]+(p[4]===undefined?-16:p[4])}\" text-anchor=\"middle\">${p[2]}<\/text>`:'')}\n  $('#sv').innerHTML=s;\n  if(c.ex){$('#ex').innerHTML=c.ex.o.map(o=>`<button data-x=\"${o}\" class=\"${c.ex.v===o?'on':''}\">${o}<\/button>`).join('');document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{c.ex.v=b.dataset.x;draw()})}}\n $('#sv').onclick=e=>{if(res&&res.ok)return;const t=e.target.closest('[data-t]'),w=e.target.closest('[data-w]');\n  if(t){const id=t.dataset.t;if(!sel)sel=id;else if(sel===id)sel=null;else{if(!W.some(x=>(x[0]===sel&&x[1]===id)||(x[0]===id&&x[1]===sel)))W.push([sel,id]);sel=null}res=null}\n  else if(w){W.splice(+w.dataset.w,1);res=null;sel=null}draw()};\n act(`<button id=\"tz\">Tozalash<\/button><button class=\"go\" id=\"ts\">🔍 Tekshir<\/button>`);\n $('#tz').onclick=()=>{W=[];sel=null;res=null;draw();msg(\"Tozalandi.\",1)};\n $('#ts').onclick=()=>{if(res&&res.ok)return;if(!W.length)return msg(\"Hali sim ulanmagan.\",0);\n  res=c.ev(W,c.ex&&c.ex.v);draw();\n  if(res.ok){works++;msg(\"✅ ISHLADI! \"+res.t,1);nextBtn()}else{if(res.burn&&res.burn.length)burns++;pen(8);msg((res.burn&&res.burn.length?\"🔥 KUYDI! \":\"❌ ISHLAMADI. \")+res.t+\" (−8)\",0)}};\n msg(\"Terminalni bosing, so'ng ikkinchisini — sim ulanadi. Simni bosib o'chirasiz.\",1);draw()}\n/* 1. Ampermetr + voltmetr */\nfunction lA(){\n const pos={L:[40,70,\"L\",18,4],N:[40,330,\"N\",18,4],A1:[154,70],A2:[206,70],P1:[310,170],P2:[310,230],V1:[154,330],V2:[206,330]};\n const ids=Object.keys(pos);\n wl({pos,tx:\"Lampaga ampermetrni (tokni o'lchash) va voltmetrni (kuchlanishni o'lchash) to'g'ri ulang.\",\n bg:r=>{const b=r&&r.burn||[];let s=`<rect x=\"10\" y=\"40\" width=\"60\" height=\"320\" rx=\"10\" fill=\"#374151\"/><text x=\"40\" y=\"205\" text-anchor=\"middle\" style=\"fill:#fff\">220 V<\/text>`;\n  s+=`<circle cx=\"180\" cy=\"70\" r=\"26\" fill=\"${b.includes('A')?'#fecaca':'#e5e7eb'}\" stroke=\"#14202b\" stroke-width=\"3\"/><text x=\"180\" y=\"76\" text-anchor=\"middle\" style=\"font-size:18px\">${b.includes('A')?'🔥':'A'}<\/text>`;\n  s+=`<circle cx=\"180\" cy=\"330\" r=\"26\" fill=\"${b.includes('V')?'#fecaca':'#e5e7eb'}\" stroke=\"#14202b\" stroke-width=\"3\"/><text x=\"180\" y=\"336\" text-anchor=\"middle\" style=\"font-size:18px\">${b.includes('V')?'🔥':'V'}<\/text>`;\n  s+=`<circle cx=\"310\" cy=\"200\" r=\"30\" fill=\"${r&&r.lamp?'#fde047':'#f1f5f9'}\" stroke=\"#14202b\" stroke-width=\"3\"/><text x=\"310\" y=\"208\" text-anchor=\"middle\" style=\"font-size:22px\">💡<\/text>`;\n  if(b.includes('S'))s+=`<text x=\"180\" y=\"205\" text-anchor=\"middle\" style=\"font-size:28px\">🔥<\/text>`;return s},\n pos,ev:W=>{const f=UF(ids,W),g=UF(ids,[...W,[\"A1\",\"A2\"]]);\n  if(g(\"L\")===g(\"N\")){const amp=f(\"L\")!==f(\"N\");return amp?{burn:[\"A\"],t:\"Ampermetr zanjirga parallel ulangan: qarshiligi deyarli nol, qisqa tutashuv!\"}:{burn:[\"S\"],t:\"L va N tutashdi: qisqa tutashuv!\"}}\n  const on=(g(\"P1\")===g(\"L\")&&g(\"P2\")===g(\"N\"))||(g(\"P1\")===g(\"N\")&&g(\"P2\")===g(\"L\"));\n  const vl=[f(\"V1\"),f(\"V2\")].includes(f(\"L\"))&&[f(\"V1\"),f(\"V2\")].some(x=>x===f(\"P1\")||x===f(\"P2\"))&&f(\"V1\")!==f(\"V2\");\n  if(!on)return{t:vl?\"Voltmetr ketma-ket ulangan: uning qarshiligi juda katta, lampaga tok o'tmaydi.\":\"Zanjir yopilmagan: lampa L va N ga ulanmagan.\"};\n  const ser=f(\"A1\")!==f(\"A2\")&&[f(\"A1\"),f(\"A2\")].includes(f(\"L\"))&&[f(\"A1\"),f(\"A2\")].some(x=>x===f(\"P1\")||x===f(\"P2\"));\n  const vo=(g(\"V1\")===g(\"P1\")&&g(\"V2\")===g(\"P2\"))||(g(\"V1\")===g(\"P2\")&&g(\"V2\")===g(\"P1\"));\n  if(!ser)return{lamp:1,t:\"Lampa yondi, lekin ampermetr tokni ko'rsatmayapti: u zanjirga ketma-ket ulanmagan.\"};\n  if(!vo)return{lamp:1,t:\"Voltmetr ko'rsatmayapti: u lampaga parallel ulanishi kerak.\"};\n  return{ok:1,lamp:1,t:\"Ampermetr 0,18 A, voltmetr 220 V ko'rsatdi.\"}}})}\n/* 2. Uch fazali motor */\nfunction lB(){\n const plate=Math.random()<.5?\"220/380\":\"380/660\";\n const pos={L1:[40,120,\"L1\",0,-16],L2:[40,200,\"L2\",0,-16],L3:[40,280,\"L3\",0,-16],U1:[230,130,\"U1\"],V1:[280,130,\"V1\"],W1:[330,130,\"W1\"],W2:[230,230,\"W2\",0,28],U2:[280,230,\"U2\",0,28],V2:[330,230,\"V2\",0,28]};\n const ids=Object.keys(pos),S=[\"L1\",\"L2\",\"L3\"];\n wl({pos,ex:{o:[\"C2\",\"C10\",\"C40\"],v:\"C10\"},tx:\"Tarmoq 380 V (3 faza). Motor shitidagi yozuvga qarab yulduz (Y) yoki uchburchak (Δ) ulang va avtomatni tanlang.\",\n bg:r=>{const b=r&&r.burn||[];let s=`<rect x=\"90\" y=\"12\" width=\"260\" height=\"46\" rx=\"8\" fill=\"#374151\"/><text x=\"220\" y=\"31\" text-anchor=\"middle\" style=\"fill:#fff\">Motor 2,2 kW · ${plate} V<\/text><text x=\"220\" y=\"48\" text-anchor=\"middle\" style=\"fill:#fde047;font-size:10px\">Tarmoq: 380 V · 3 faza<\/text>`;\n  s+=`<rect x=\"205\" y=\"85\" width=\"150\" height=\"190\" rx=\"12\" fill=\"${b.includes('M')?'#fecaca':'#e5e7eb'}\" stroke=\"#14202b\" stroke-width=\"3\"/><text x=\"280\" y=\"300\" text-anchor=\"middle\">Klemma qutisi<\/text><text x=\"280\" y=\"190\" text-anchor=\"middle\" style=\"font-size:10px\">${b.includes('M')?'':'(motor)'}<\/text>`;\n  if(r&&r.ok)s+=`<text class=\"spin\" x=\"280\" y=\"195\" text-anchor=\"middle\" style=\"font-size:36px\">⚙️<\/text>`;\n  if(b.includes('M'))s+=`<text x=\"280\" y=\"195\" text-anchor=\"middle\" style=\"font-size:40px\">🔥<\/text>`;\n  if(b.includes('S'))s+=`<text x=\"120\" y=\"200\" text-anchor=\"middle\" style=\"font-size:36px\">🔥<\/text>`;\n  s+=`<text x=\"120\" y=\"340\" style=\"font-size:11px;fill:var(--mut)\" text-anchor=\"middle\">Manba<\/text>`;return s},\n ev:(W,am)=>{const f=UF(ids,W);\n  if(new Set(S.map(f)).size<3)return{burn:[\"S\"],t:\"Fazalar tutashdi: qisqa tutashuv!\"};\n  const sup=x=>S.filter(s=>f(s)===f(x));const dist=a=>a.every(x=>sup(x).length===1)&&new Set(a.map(x=>sup(x)[0])).size===a.length;\n  const Y=f(\"U2\")===f(\"V2\")&&f(\"V2\")===f(\"W2\")&&!sup(\"U2\").length&&dist([\"U1\",\"V1\",\"W1\"]);\n  const D=f(\"U1\")===f(\"W2\")&&f(\"V1\")===f(\"U2\")&&f(\"W1\")===f(\"V2\")&&dist([\"U1\",\"V1\",\"W1\"]);\n  if(!Y&&!D)return{t:\"Motor chulg'amlari to'liq ulanmagan: uchta faza va yulduz/uchburchak sxemasi kerak.\"};\n  if(plate===\"220/380\"&&D)return{burn:[\"M\"],t:\"Chulg'am 220 V ga mo'ljallangan, uchburchakda unga 380 V tushdi!\"};\n  if(plate===\"380/660\"&&Y)return{t:\"Yulduzda chulg'amga 220 V tushdi: motor qiyin aylanadi, quvvati 1/3 (bu plastinkada uchburchak kerak).\"};\n  if(am===\"C2\")return{t:\"Avtomat C2 ishga tushish tokida o'chib qoldi.\"};\n  if(am===\"C40\")return{t:\"Motor aylandi, lekin C40 juda katta: motor va kabel himoyasiz (C10 mos).\"};\n  return{ok:1,t:\"Motor aylanyapti. Tok qisqichi: ≈ 4,8 A.\"}}})}\n/* 3. Anjomlar yuklamasi */\nfunction lC(){\n const AP=[[\"🫖\",\"Chaynik\",20],[\"♨️\",\"Dazmol\",18],[\"❄️\",\"Konditsioner\",15],[\"📡\",\"Mikroto'lqinli pech\",10],[\"🖥️\",\"Kompyuter\",4],[\"🧊\",\"Muzlatgich\",3]];\n let as=AP.map(()=>0),res=null;\n $('#tx').textContent=\"Har bir rozetka liniyasi 16 A: eng ko'pi 3,5 kW. Anjomlarni ikki liniyaga taqsimlang (bosib 1 → 2 → ulanmagan).\";\n $('#view').innerHTML=`<div class=\"pad\"><div id=\"bars\"><\/div><div id=\"ap\"><\/div><\/div>`;\n const sum=l=>AP.reduce((a,x,i)=>a+(as[i]===l?x[2]:0),0);\n function draw(){\n  $('#bars').innerHTML=[1,2].map(l=>{const s=sum(l),bad=s>35;return `<div class=\"bar\"><b>Liniya ${l} · 16 A<\/b> — ${(s/10).toFixed(1).replace('.',',')} / 3,5 kW<div class=\"trk\"><i style=\"width:${Math.min(100,s/35*100)}%;background:${bad?'#dc2626':'#16a34a'}\"><\/i><\/div>${res?`<div class=\"v\" style=\"color:${bad?'var(--bad)':'var(--ok)'}\">${bad?'🔥 KABEL KUYDI':'✅ ISHLADI'} · tok qisqichi: ${(s*100/220).toFixed(1).replace('.',',')} A<\/div>`:''}<\/div>`}).join('');\n  $('#ap').innerHTML=AP.map((a,i)=>`<button class=\"ap\" data-i=\"${i}\"><div>${a[0]} ${a[1]} · ${(a[2]/10).toFixed(1).replace('.',',')} kW<\/div><span>${as[i]?'L'+as[i]:'—'}<\/span><\/button>`).join('');\n  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(res&&res.ok)return;const i=+b.dataset.i;as[i]=(as[i]+1)%3;res=null;draw()})}\n act(`<button class=\"go\" id=\"ts\">🔍 Tekshir<\/button>`);\n $('#ts').onclick=()=>{if(res&&res.ok)return;if(as.includes(0))return msg(\"Hamma anjomni biror liniyaga ulang.\",0);\n  const b=[1,2].filter(l=>sum(l)>35);res={ok:!b.length};draw();\n  if(!b.length){works+=2;msg(\"✅ Ikkala liniya ham ishladi!\",1);nextBtn()}else{burns+=b.length;works+=2-b.length;pen(8);msg(\"🔥 Liniya \"+b.join(\", \")+\" kabeli ortiqcha yuklanishdan kuydi. Qayta taqsimlang (−8)\",0)}};\n msg(\"Jami quvvat 7,0 kW: har liniyaga aniq 3,5 kW to'g'ri keladi.\",1);draw()}\n/* 4. Nosozlikni topish */\nfunction lD(){\n const E=[\"Kabel 1\",\"Klemma\",\"O'chirgich\",\"Kabel 2\",\"Lampa\"],F=[\"uzilgan\",\"bo'shab qolgan (kontakt yo'q)\",\"kontakti kuygan\",\"kesilgan\",\"kuygan\"];\n const br=Math.floor(Math.random()*5),M={};let pr=0,done=false;\n $('#tx').textContent=\"Lampa yonmayapti. Multimetr bilan tugunlarni o'lchang (N0–N4), so'ng nosoz qismni bosing. 3 ta o'lchovdan keyin har biri −2.\";\n $('#view').innerHTML=`<svg id=\"sv\" viewBox=\"0 0 360 400\"><\/svg>`;\n const Y=i=>40+i*62;\n function draw(){let s=`<rect x=\"190\" y=\"50\" width=\"160\" height=\"90\" rx=\"10\" fill=\"#fde047\" stroke=\"#14202b\" stroke-width=\"3\"/><text x=\"270\" y=\"78\" text-anchor=\"middle\" style=\"fill:#14202b\">Multimetr<\/text><text x=\"270\" y=\"116\" text-anchor=\"middle\" style=\"fill:#14202b;font-size:22px\">${M.last||\"— V\"}<\/text>`;\n  s+=`<line x1=\"100\" y1=\"${Y(0)}\" x2=\"100\" y2=\"${Y(4)+62}\" stroke=\"#94a3b8\" stroke-width=\"5\"/>`;\n  for(let k=1;k<=5;k++){const y=Y(k-1)+31;s+=`<g data-e=\"${k}\"><rect x=\"55\" y=\"${y-14}\" width=\"90\" height=\"28\" rx=\"7\" fill=\"${done&&k===br+1?'#fecaca':'#e5e7eb'}\" stroke=\"#14202b\" stroke-width=\"2\"/><text x=\"100\" y=\"${y+4}\" text-anchor=\"middle\">${E[k-1]}<\/text><\/g>`}\n  for(let i=0;i<5;i++){const m=M[i];s+=`<g data-n=\"${i}\"><circle cx=\"100\" cy=\"${Y(i)}\" r=\"12\" fill=\"${m===undefined?'#fff':m?'#4ade80':'#f87171'}\" stroke=\"#14202b\" stroke-width=\"3\"/><\/g><text x=\"72\" y=\"${Y(i)+4}\" text-anchor=\"end\">N${i}<\/text>`}\n  s+=`<text x=\"270\" y=\"190\" text-anchor=\"middle\" style=\"font-size:11px;fill:var(--mut)\">O'lchovlar: ${pr}<\/text><text x=\"100\" y=\"${Y(4)+86}\" text-anchor=\"middle\" style=\"font-size:11px;fill:var(--mut)\">N (nol)<\/text>`;\n  if(done)s+=`<text x=\"270\" y=\"240\" text-anchor=\"middle\" style=\"font-size:44px\">🔧<\/text>`;\n  $('#sv').innerHTML=s}\n $('#sv').onclick=e=>{if(done)return;const n=e.target.closest('[data-n]'),el=e.target.closest('[data-e]');\n  if(n){const i=+n.dataset.n,lv2=i<=br;pr++;if(pr>3)pen(2);M[i]=lv2;M.last=\"N\"+i+\": \"+(lv2?\"220 V\":\"0 V\");msg(lv2?\"N\"+i+\" da kuchlanish bor ✓\":\"N\"+i+\" da kuchlanish yo'q ✗\",lv2);draw()}\n  else if(el){const k=+el.dataset.e;if(k===br+1){done=true;works++;msg(\"✅ To'g'ri! \"+E[br]+\" \"+F[br]+\".\",1);draw();nextBtn()}else{pen(10);msg(\"Bu qism soz. Tugunlardagi 220 V / 0 V ga qarang (−10)\",0)}}};\n act(\"\");msg(\"Multimetrni nolga nisbatan ulang: tugunni bosing.\",1);draw()}\nstart();\n<\/script><\/body><\/html>\n"}, {"c": "Elektr va elektronika", "e": "🚁", "t": "Datchiklar: aqlli uy va dron", "d": "Datchik joylash, Arduino'ga ulash, dron yig'ish", "u": "https://claude.ai/artifact/RY2RxTrW2z7H3g8K833WGa", "h": "<!DOCTYPE html>\n<html lang=\"uz\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Datchiklar: aqlli uy va dron<\/title>\n<style>\n:root{--card:#fff;--bg:#dde2e7;--ink:#14202b;--mut:#5b6773;--line:#c9d0d7;--y:#f5c400;--ok:#15803d;--bad:#c62828}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--card:#1b252f;--bg:#10171e;--ink:#eef2f5;--mut:#9aa7b3;--line:#33414e;--ok:#4ade80;--bad:#f87171}}\n:root[data-theme=\"dark\"]{--card:#1b252f;--bg:#10171e;--ink:#eef2f5;--mut:#9aa7b3;--line:#33414e;--ok:#4ade80;--bad:#f87171}\n[hidden]{display:none!important}\nhtml,body{margin:0;height:100%;background:var(--bg);font:500 15px/1.4 system-ui,sans-serif;color:var(--ink)}\nbody{display:flex;flex-direction:column}\n#hud{padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;display:flex;justify-content:space-between;align-items:center;background:#14202b;color:#fff;border-bottom:3px solid var(--y)}\n#hud b{font-size:17px}#hud small{display:block;color:#cbd5dd}\n.sc{background:var(--y);color:#14202b;font-weight:700;font-size:20px;padding:2px 12px;border-radius:4px}\n#view{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}\nsvg{flex:1;min-height:0;width:100%;display:block;background:var(--card);touch-action:manipulation}\nsvg text{font:700 11px system-ui,sans-serif;pointer-events:none;fill:var(--ink)}\n#bt{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--line)}\n#tx{font-size:14px;color:var(--mut)}#msg{margin:4px 0 8px;min-height:40px;font-weight:600;color:var(--mut)}#msg.ok{color:var(--ok)}#msg.bad{color:var(--bad)}\n#act{display:flex;gap:8px}#act button,#ex button{flex:1;padding:12px 4px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-weight:700}\n#act button.go{background:var(--y);color:#14202b;border:0;font-size:17px}\n#ex{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;background:var(--card)}#ex button{flex:1 1 28%;padding:8px 2px;font-size:13px}#ex button.on{border-color:var(--y);box-shadow:0 0 0 2px var(--y)}\n#rs{padding:6px 12px;background:var(--card);font-size:13px;line-height:1.5}\n.pad{padding:12px}\n.bar{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}\n.trk{height:12px;background:var(--line);border-radius:6px;margin-top:6px;overflow:hidden}.trk i{display:block;height:100%}\n.ap{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;padding:10px 12px;margin-bottom:6px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:14px}\n.ap.on{border-color:var(--ok)}.ap span{background:var(--y);color:#14202b;border-radius:6px;padding:2px 10px;font-weight:700}\n.big{font-size:56px;text-align:center}\n#end{position:fixed;inset:0;background:#14202bee;display:flex;align-items:center;justify-content:center;padding:18px}\n#end>div{background:var(--card);border-radius:10px;padding:22px;text-align:center;max-width:340px}\n#stars{font-size:44px;color:#d4a000;margin:6px 0}\nbutton:focus-visible{outline:3px solid var(--y)}\n@media(prefers-reduced-motion:no-preference){.fl{animation:fl 1.2s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}.shake{animation:sk .25s}@keyframes sk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}}\n<\/style><\/head><body>\n<div id=\"hud\"><div><b>Datchiklar<\/b><small id=\"tk\"><\/small><\/div><div class=\"sc\" id=\"sc\">100<\/div><\/div>\n<div id=\"view\"><\/div>\n<div id=\"bt\"><div id=\"tx\"><\/div><div id=\"msg\"><\/div><div id=\"act\"><\/div><\/div>\n<div id=\"end\" hidden><div><h2 style=\"margin:0\">Hammasi tayyor!<\/h2><div id=\"stars\"><\/div><p id=\"res\"><\/p><button style=\"background:#f5c400;border:0;border-radius:8px;padding:12px 20px;font:700 17px system-ui\" onclick=\"location.reload()\">Qayta o'ynash<\/button><\/div><\/div>\n<script>\nconst $=s=>document.querySelector(s);\nconst NM=[\"Aqlli uy datchiklari\",\"Datchikni kontrollerga ulash\",\"Dron yig'ish\"];\nlet lv=0,score=100,burns=0,works=0;\nfunction hud(){$('#tk').textContent=(lv+1)+\"/3 · \"+NM[lv];$('#sc').textContent=score}\nfunction msg(t,ok){const e=$('#msg');e.textContent=t;e.className=ok?'ok':'bad';if(!ok){const s=$('#view');s.classList.remove('shake');void s.getBoundingClientRect();s.classList.add('shake')}}\nfunction pen(n){score=Math.max(0,score-n);hud()}\nfunction act(h){$('#act').innerHTML=h}\nfunction nextBtn(){act(`<button class=\"go\" id=\"nx\">${lv<2?\"Keyingi bosqich →\":\"Natijani ko'rish\"}<\/button>`);$('#nx').onclick=()=>{lv++;lv<3?start():end()}}\nfunction start(){hud();[l1,l2,l3][lv]()}\nfunction end(){const n=score>=80?3:score>=55?2:1;$('#stars').textContent='★'.repeat(n)+'☆'.repeat(3-n);$('#res').textContent=\"Ball: \"+score+\" / 100 · Ishladi: \"+works+\" · Kuydi/halokat: \"+burns;$('#end').hidden=false}\nfunction UF(ids,E){const p={};ids.forEach(i=>p[i]=i);const f=x=>p[x]===x?x:(p[x]=f(p[x]));E.forEach(e=>{p[f(e[0])]=f(e[1])});return f}\n\n/* 1. Aqlli uy */\nfunction l1(){\n const S={eshik:[\"🚪\",\"Eshik\"],pir:[\"🚶\",\"Harakat\"],tutun:[\"🚨\",\"Tutun\"],suv:[\"💧\",\"Suv\"],harorat:[\"🌡️\",\"Harorat\"],yorug:[\"☀️\",\"Yorug'lik\"]};\n const SP=[[\"a\",\"eshik\",60,356,\"eshik romi\"],[\"b\",\"pir\",180,232,\"koridor shifti\"],[\"c\",\"tutun\",270,92,\"plita usti, shift\"],[\"d\",\"suv\",235,352,\"hammom poli\"],[\"e\",\"harorat\",36,150,\"devor, 1,5 m\"],[\"f\",\"yorug\",150,58,\"deraza yonida\"]].map(a=>({id:a[0],k:a[1],x:a[2],y:a[3],l:a[4]}));\n const EV=[[\"eshik\",\"🚪 Kimdir eshikni ochdi\",\"signal berdi\",\"o'g'ri sezilmadi\"],[\"pir\",\"🌙 Koridorda odam yurdi\",\"chiroq yondi\",\"chiroq yonmadi\"],[\"tutun\",\"🍳 Oshxonada tutun chiqdi\",\"sirena va 101 ga xabar\",\"yong'in tarqaldi 🔥\"],[\"suv\",\"🛁 Hammomda quvur oqdi\",\"klapan yopildi\",\"uy suv ostida qoldi\"],[\"harorat\",\"🌡️ Xona sovib ketdi\",\"isitgich yondi\",\"isitgich yonmadi\"],[\"yorug\",\"☀️ Quyosh juda yorqin\",\"parda yopildi\",\"parda yopilmadi\"]];\n let pl={},sel=null,ran=false;\n $('#view').innerHTML=`<svg id=\"sv\" viewBox=\"0 0 360 400\"><\/svg><div id=\"ex\"><\/div><div id=\"rs\"><\/div>`;\n $('#tx').textContent=\"Datchikni tanlang, so'ng uydagi mos joyni bosing (qo'yilganini bossangiz, olinadi). Keyin simulyatsiyani ishga tushiring.\";\n const free=()=>Object.keys(S).filter(k=>!Object.values(pl).includes(k));\n function draw(){\n  let s=`<rect x=\"10\" y=\"40\" width=\"340\" height=\"340\" rx=\"8\" fill=\"none\" stroke=\"#14202b\" stroke-width=\"4\"/><rect x=\"12\" y=\"42\" width=\"176\" height=\"156\" fill=\"#cbd5e1\" opacity=\".5\"/><rect x=\"190\" y=\"42\" width=\"158\" height=\"156\" fill=\"#fde68a\" opacity=\".5\"/><rect x=\"12\" y=\"200\" width=\"336\" height=\"58\" fill=\"#e5e7eb\" opacity=\".6\"/><rect x=\"190\" y=\"260\" width=\"158\" height=\"118\" fill=\"#bae6fd\" opacity=\".6\"/><rect x=\"12\" y=\"260\" width=\"176\" height=\"118\" fill=\"#d1fae5\" opacity=\".6\"/>`;\n  s+=`<text x=\"100\" y=\"58\" text-anchor=\"middle\" style=\"fill:var(--mut)\">Mehmonxona<\/text><text x=\"270\" y=\"58\" text-anchor=\"middle\" style=\"fill:var(--mut)\">Oshxona<\/text><text x=\"60\" y=\"216\" style=\"fill:var(--mut)\">Koridor<\/text><text x=\"270\" y=\"276\" text-anchor=\"middle\" style=\"fill:var(--mut)\">Hammom<\/text><text x=\"100\" y=\"276\" text-anchor=\"middle\" style=\"fill:var(--mut)\">Kirish<\/text>`;\n  [[\"🛋️\",90,140],[\"🍳\",270,140],[\"🛁\",300,330],[\"🪟\",150,44],[\"🚪\",60,382]].forEach(d=>s+=`<text x=\"${d[1]}\" y=\"${d[2]}\" text-anchor=\"middle\" style=\"font-size:26px\">${d[0]}<\/text>`);\n  SP.forEach(p=>{const k=pl[p.id];s+=`<g data-s=\"${p.id}\"><circle cx=\"${p.x}\" cy=\"${p.y}\" r=\"17\" fill=\"${k?'#fff':'rgba(245,196,0,.35)'}\" stroke=\"${k?'#14202b':'#f5c400'}\" stroke-width=\"3\" ${k?'':'stroke-dasharray=\"5 3\"'}/>${k?`<text x=\"${p.x}\" y=\"${p.y+6}\" text-anchor=\"middle\" style=\"font-size:18px\">${S[k][0]}<\/text>`:''}<text x=\"${p.x}\" y=\"${p.y+31}\" text-anchor=\"middle\" style=\"font-size:9px\">${p.l}<\/text><\/g>`});\n  $('#sv').innerHTML=s;\n  $('#ex').innerHTML=free().map(k=>`<button data-k=\"${k}\" class=\"${sel===k?'on':''}\">${S[k][0]}<br>${S[k][1]}<\/button>`).join('');\n  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{sel=b.dataset.k;draw()})}\n $('#sv').onclick=e=>{const g=e.target.closest('[data-s]');if(!g||ran&&0)return;const id=g.dataset.s;\n  if(sel){for(const x in pl)if(pl[x]===sel)delete pl[x];pl[id]=sel;sel=null}else if(pl[id])delete pl[id];\n  $('#rs').innerHTML=\"\";draw()};\n act(`<button class=\"go\" id=\"ts\">▶ Simulyatsiya<\/button>`);\n $('#ts').onclick=()=>{if(free().length)return msg(\"Hamma datchikni joylang.\",0);\n  let ok=0,fire=0;$('#rs').innerHTML=EV.map(e=>{const sp=SP.find(p=>p.k===e[0]),g=pl[sp.id]===e[0];if(g)ok++;else if(e[0]==='tutun')fire=1;return `${g?'✅':'💥'} ${e[1]}: ${g?e[2]:e[3]}`}).join('<br>');\n  if(ok===6){works+=6;msg(\"✅ Hamma datchik ishladi! Uy xavfsiz va aqlli.\",1);nextBtn()}else{works+=ok;burns+=fire;pen(8);msg((fire?\"🔥 Tutun datchigi no
